name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run spec:lint
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    env:
      # The frontend job never starts MongoDB, so skip the binary download.
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:client
      - run: npm run test:client
      - run: npm run build:client

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - name: Validate EC2 deployment configuration
        run: |
          docker compose --env-file .env.ec2.example -f docker-compose.ec2.yml config --quiet
          docker compose --env-file .env.ec2.example -f docker-compose.ec2.yml -f docker-compose.cloudwatch.yml config --quiet
      - run: docker compose build

  smoke:
    runs-on: ubuntu-latest
    needs: docker
    env:
      # MongoDB 8 refuses to start on Linux kernel 6.19 and newer (SERVER-121912),
      # which GitHub's runners now use. MongoDB 7 has no such limit.
      MONGO_VERSION: '7.0'
      SEED_PASSWORD: Smoke-test-password-123
      GATEWAY_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: docker compose up -d --build --wait gateway
      - run: npm run seed
      - run: npm run smoke
      - name: Show container state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
