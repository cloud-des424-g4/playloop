worker_processes auto;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # A variable in proxy_pass makes Nginx look up the container IP again after a restart
  resolver 127.0.0.11 valid=10s;
  client_max_body_size 2m;

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_intercept_errors on;
    error_page 502 503 504 = @unavailable;

    location /api/auth/ {
      set $upstream identity:4001;
      proxy_pass http://$upstream;
    }

    location /api/me/notifications {
      set $upstream notifications:4003;
      proxy_pass http://$upstream;
    }

    location /api/uploads {
      set $upstream media:4004;
      proxy_pass http://$upstream;
    }

    location /api/ {
      set $upstream community:4002;
      proxy_pass http://$upstream;
    }

    location / {
      default_type application/json;
      return 404 '{"code":"NOT_FOUND","message":"Not found"}';
    }

    location @unavailable {
      default_type application/json;
      return 503 '{"code":"SERVICE_UNAVAILABLE","message":"This service is unavailable, please try again"}';
    }
  }
}
