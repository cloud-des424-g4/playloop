name: playloop

x-service: &service
  depends_on:
    mongo:
      condition: service_healthy
  restart: unless-stopped

x-storage-service: &storage-service
  depends_on:
    mongo:
      condition: service_healthy
    storage-init:
      condition: service_completed_successfully
  restart: unless-stopped

x-service-env: &service-env
  NODE_ENV: development
  LOG_LEVEL: info
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-dev-service-secret}
  CLIENT_ORIGIN: http://localhost:5173
  IDENTITY_URL: http://identity:4001
  COMMUNITY_URL: http://community:4002
  NOTIFICATIONS_URL: http://notifications:4003
  MEDIA_URL: http://media:4004

x-storage-env: &storage-env
  AWS_REGION: ap-southeast-1
  AWS_ACCESS_KEY_ID: playloop
  AWS_SECRET_ACCESS_KEY: playloop-secret
  S3_ENDPOINT: http://storage:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_MEDIA_BUCKET: playloop-local-media
  S3_BUILDS_BUCKET: playloop-local-builds
  S3_PLAY_BUCKET: playloop-local-play
  MEDIA_CDN_URL: http://localhost:9000/playloop-local-media
  PLAY_CDN_URL: http://localhost:9000/playloop-local-play

services:
  gateway:
    build: services/gateway
    ports:
      - '4000:80'
    depends_on:
      identity:
        condition: service_healthy
      community:
        condition: service_healthy
      notifications:
        condition: service_healthy
      media:
        condition: service_healthy

  identity:
    <<: *service
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: identity
    environment:
      <<: *service-env
      PORT: 4001
      MONGODB_URI: mongodb://mongo:27017/playloop_identity?directConnection=true
      SEED_PASSWORD: ${SEED_PASSWORD:-}

  community:
    <<: *storage-service
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: community
    environment:
      <<: [*service-env, *storage-env]
      PORT: 4002
      MONGODB_URI: mongodb://mongo:27017/playloop_community?directConnection=true
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-dev-webhook-secret}

  notifications:
    <<: *service
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: notifications
    environment:
      <<: *service-env
      PORT: 4003
      MONGODB_URI: mongodb://mongo:27017/playloop_notifications?directConnection=true

  media:
    <<: *storage-service
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: media
    environment:
      <<: [*service-env, *storage-env]
      PORT: 4004
      MONGODB_URI: mongodb://mongo:27017/playloop_media?directConnection=true

  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >-
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  storage:
    image: rustfs/rustfs:1.0.2
    environment:
      RUSTFS_ACCESS_KEY: playloop
      RUSTFS_SECRET_KEY: playloop-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:9000/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  storage-init:
    image: amazon/aws-cli:2.38.1
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: playloop
      AWS_SECRET_ACCESS_KEY: playloop-secret
      AWS_DEFAULT_REGION: ap-southeast-1
      CORS: >-
        {"CORSRules":[{"AllowedOrigins":["http://localhost:5173"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"]}]}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        s3api() { aws --endpoint-url http://storage:9000 s3api "$$@"; }
        for b in playloop-local-media playloop-local-builds playloop-local-play; do
          s3api head-bucket --bucket "$$b" 2>/dev/null || s3api create-bucket --bucket "$$b"
        done
        for b in playloop-local-media playloop-local-builds; do
          s3api put-bucket-cors --bucket "$$b" --cors-configuration "$$CORS"
        done
        for b in playloop-local-media playloop-local-play; do
          s3api put-bucket-policy --bucket "$$b" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$b/*\"]}]}"
        done
        echo storage ready

volumes:
  mongo-data:
  storage-data:
